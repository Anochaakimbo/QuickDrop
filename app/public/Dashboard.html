<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickDrop Logs</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center mb-8">QuickDrop Logs</h1>
        
        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-lg font-semibold text-gray-700">Total Transfers</h2>
                <p class="text-3xl font-bold text-blue-600" id="total-transfers">0</p>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-lg font-semibold text-gray-700">Total File Size</h2>
                <p class="text-3xl font-bold text-green-600" id="total-size">0 MB</p>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-lg font-semibold text-gray-700">Success Rate</h2>
                <p class="text-3xl font-bold text-indigo-600" id="success-rate">0%</p>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-lg font-semibold text-gray-700">Most Active Device</h2>
                <p class="text-xl font-bold text-purple-600" id="most-active">-</p>
            </div>
        </div>
        
        <!-- Charts -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-white rounded-lg shadow p-4">
                <h2 class="text-lg font-semibold mb-4">Transfers By File Type</h2>
                <canvas id="file-type-chart"></canvas>
            </div>
            <div class="bg-white rounded-lg shadow p-4">
                <h2 class="text-lg font-semibold mb-4">Transfers Over Time</h2>
                <canvas id="time-chart"></canvas>
            </div>
        </div>
        
        <!-- Log Table -->
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <div class="px-4 py-5 border-b border-gray-200">
                <h3 class="text-lg leading-6 font-medium text-gray-900">
                    Recent Transfers <span class="text-sm text-gray-500">(Auto-refresh)</span>
                </h3>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Time</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Sender</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Receiver</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">File</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Size</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200" id="logs-table-body">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let allLogs = [];
        let fileTypeChart, timeChart;
    
        function fetchLogs() {
            fetch('http://localhost:3000/api/logs')
                .then(res => res.json())
                .then(logs => {
                    allLogs = logs;
                    updateTable();
                    updateDashboard();
                    updateCharts();
                });
        }
    
        function updateTable() {
            const tbody = document.getElementById('logs-table-body');
            tbody.innerHTML = '';
            allLogs.forEach(log => addLogToTable(log));
        }
    
        function addLogToTable(log) {
            const tbody = document.getElementById('logs-table-body');
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="px-6 py-4 text-sm text-gray-500">${moment(log.timestamp).format('YYYY-MM-DD HH:mm:ss')}</td>
                <td class="px-6 py-4">${log.senderName} (${log.senderIp})</td>
                <td class="px-6 py-4">${log.receiverName} (${log.receiverIp})</td>
                <td class="px-6 py-4">${log.fileName}</td>
                <td class="px-6 py-4">${formatFileSize(log.fileSize)}</td>
                <td class="px-6 py-4">${log.successful ? '✅' : '❌'}</td>
            `;
            tbody.prepend(tr);
        }
    
        function updateDashboard() {
            document.getElementById('total-transfers').textContent = allLogs.length;
            const totalSize = allLogs.reduce((sum, log) => sum + log.fileSize, 0);
            document.getElementById('total-size').textContent = formatFileSize(totalSize);
            const successRate = allLogs.length ? (allLogs.filter(log => log.successful).length / allLogs.length * 100).toFixed(1) : 0;
            document.getElementById('success-rate').textContent = successRate + '%';
        }
    
        function updateCharts() {
            const fileTypeData = {}, timeData = {};

            allLogs.forEach(log => {
                fileTypeData[log.fileType] = (fileTypeData[log.fileType] || 0) + 1;
                const date = moment(log.timestamp).format('YYYY-MM-DD');
                timeData[date] = (timeData[date] || 0) + 1;
            });

            // อัปเดต Pie Chart ของ File Type
            if (fileTypeChart) fileTypeChart.destroy();
            fileTypeChart = new Chart(document.getElementById('file-type-chart').getContext('2d'), {
                type: 'pie',
                data: {
                    labels: Object.keys(fileTypeData),
                    datasets: [{
                        data: Object.values(fileTypeData),
                        backgroundColor: ['#ff6384', '#36a2eb', '#ffce56']
                    }]
                }
            });

            // 📌 ล้างค่าเก่าของ Canvas (ป้องกันการขยาย)
            const timeChartCanvas = document.getElementById('time-chart');
            timeChartCanvas.parentNode.innerHTML = `<canvas id="time-chart"></canvas>`;

            // อัปเดต Line Chart ของ Transfers Over Time
            timeChart = new Chart(document.getElementById('time-chart').getContext('2d'), {
                type: 'line',
                data: {
                    labels: Object.keys(timeData),
                    datasets: [{
                        label: 'Transfers Over Time',
                        data: Object.values(timeData),
                        borderColor: '#36a2eb',
                        backgroundColor: 'rgba(54, 162, 235, 0.2)',
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false, // ป้องกันการยืดของกราฟ
                    scales: {
                        x: { title: { display: true, text: 'Date' } },
                        y: { title: { display: true, text: 'Number of Transfers' }, beginAtZero: true }
                    }
                }
            });
        }


    
        // 📌 **ฟังก์ชันแปลงหน่วยไฟล์ (Bytes -> KB, MB, GB, TB)**
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(2) + ' KB';
            if (bytes < 1073741824) return (bytes / 1048576).toFixed(2) + ' MB';
            if (bytes < 1099511627776) return (bytes / 1073741824).toFixed(2) + ' GB';
            return (bytes / 1099511627776).toFixed(2) + ' TB';
        }
    
        setInterval(fetchLogs, 5000);
        fetchLogs();
    </script>
    
</body>
</html>
